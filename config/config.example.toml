# Jarvis-Muse — configuration publique (exemple)
# Copier vers config.toml et adapter.
# Ce fichier est versionné. Ne jamais y mettre de secret ni de chemin personnel.
# Les valeurs privées vont dans config.local.toml, les secrets dans .env.

[general]
# Langues : "en" par défaut à moyen terme (décision 21 nov. 2026) — les voix
# françaises Piper écoutées (Gilles, Tom) sonnaient trop robotiques ; le
# français passe par la voix UPMC quand on y revient. Bascule automatique
# selon la langue parlée : pas encore implémentée, une langue à la fois.
langue = "en"
langues_disponibles = ["fr", "en"]
fuseau_horaire = "America/Toronto"

[voix]
# TTS locale : Piper (voix par défaut, voir scripts/lire_voix.py).
# Français : Piper "upmc" (féminine, UPMC/LIMSI — choisie le 21 nov. 2026 ;
# "gilles" jugée trop robotique). Télécharger avec :
#   python -m piper.download_voices fr_FR-upmc-medium --data-dir models
# Anglais (défaut à moyen terme) : Piper "alan" (masculine britannique),
# voix "en_GB-alan-medium". Kokoro reste une option ultérieure pour l'anglais.
moteur = "piper"
voix_fr = "upmc"
voix_en = "alan"
vitesse = 1.0
# Effet "voice in the walls" (optionnel)
effet_murs = false

[declenchement]
# Déclencheur actuel : push-to-talk F9 (validé le 21 nov. 2026, étape 4).
# Mot de réveil et double-clap : décisions "plus tard" (21 nov. 2026).
# Maintenir F9 pour parler, relâcher pour envoyer ; F9 pendant la réponse
# l'interrompt.
mode = "push_to_talk"
touche_push_to_talk = "F9"

[boucle]
# Boucle vocale interactive (étape 4) — scripts/boucle_voix.py.
# Cerveau par défaut : Groq gratuit (gpt-oss-120b, palier gratuit, sans carte).
# Alternative : "anthropic" (Claude Haiku par API, payant à l'usage, clé dans .env).
# Précision : Muse Code est l'outillage de construction, pas le cerveau de la
# boucle (pas une API temps réel) — la boucle fait un appel API par tour.
fournisseur_llm = "groq"
modele_groq = "openai/gpt-oss-120b"
modele_anthropic = "claude-haiku-4-5-20251001"
# Transcription par défaut : Groq Whisper (whisper-large-v3-turbo).
# "local" = faster-whisper hors ligne (décision bloc 5, encore ouverte).
fournisseur_stt = "groq"
modele_stt_groq = "whisper-large-v3-turbo"
modele_stt_local = "base"
langue = "en"  # Défaut « en » à moyen terme (décision 21 nov. 2026).
duree_max_enregistrement = 30.0
duree_min_enregistrement = 0.3
max_tours_outils = 3
max_tokens_reponse = 400

[minuteur]
# Minuteur persistant local (décision OUI, 21 nov. 2026)
max_actifs = 20
duree_max = "7j"
fichier = "data/timers.json"

[yeux]
# Vision d'écran ciblée (étape 5) — scripts/yeux.py.
# Capture ciblée par défaut (fenêtre active) ; jamais tout l'écran sans
# --tout-ecran explicite ; consentement oral à chaque capture en boucle vocale.
# Fournisseur vision par défaut : "groq" (qwen/qwen3.8-27b, multimodal —
# un seul service, Groq, pour cerveau + STT + vision, décision de Julien
# le 21 nov. 2026). Llama 4 Scout a été retiré du palier gratuit Groq
# le 17 juill. 2026. qwen3.8-27b est un modèle « preview » : il peut être
# retiré à court préavis (erreur 404 = modèle indisponible).
# Repli : "anthropic" (Claude Haiku, vision confirmée, payant à l'usage,
# quelques centimes par capture au plus) — basculer = une ligne ici.
fournisseur_vision = "groq"
modele_vision_groq = "qwen/qwen3.8-27b"
modele_vision_anthropic = "claude-haiku-4-5-20251001"
largeur_max = 1280
max_tokens_description = 300

[navigateur]
# Contrôle du navigateur (étape 5) — scripts/navigateur.py (Playwright).
# Lecture seule par défaut : navigation, recherche, clics sur liens/boutons
# hors formulaire, lecture de texte, capture de page. Aucune soumission de
# formulaire, aucune connexion, aucun achat (hold_writes).
navigateur_defaut = "systeme"  # "systeme" (navigateur par défaut) ou "playwright"
delai_apres_navigation = 2
max_caracteres_page = 5000

[securite]
# Ne jamais changer sans relire docs/regles-securite.md
hote_serveur = "127.0.0.1"
blocage_ecritures_apres_lecture_externe = true
confirmation_orale_max_mots = 8

[hud]
# HUD local léger (décision OUI, 21 nov. 2026) — scripts/hud.py (Tkinter,
# bibliothèque standard, pas de navigateur embarqué). Le HUD du dépôt B
# coûte ~760 Mo en veille : garder celui-ci minimal (< 100 Mo, ~0 % CPU).
active = true
# Position : "bas-droite" (défaut), "bas-gauche", "haut-droite", "haut-gauche".
# La position exacte est mémorisée dans data/widget.json (gitignoré).
position = "bas-droite"
taille = 180
toujours_au_premier_plan = true
# Intervalle de relecture de l'état (ms) — data/hud-state.json, écrit par
# la boucle vocale à chaque changement d'état.
intervalle_ms = 500

[app]
# Application Jarvis (étape 7, décision 21 nov. 2026) — scripts/app.py
# (CustomTkinter, thème sombre, ambiance du Jarvis de référence :
# fond très sombre, orbe lumineux qui pulse, conversation écrite).
# Remplacera le HUD quand elle sera validée ; le HUD reste disponible
# entre-temps (les deux lisent les mêmes fichiers data/).
active = true
largeur = 900   # largeur de la fenêtre en pixels (640 à 1600)
hauteur = 650   # hauteur de la fenêtre en pixels (480 à 1200)
toujours_au_premier_plan = false
# Intervalle de relecture de l'état, de la conversation et des minuteurs
# (ms) — data/hud-state.json, data/conversation.jsonl, data/timers.json.
intervalle_ms = 500
# La position et la taille exactes sont mémorisées dans data/app.json
# (gitignoré) quand la fenêtre est déplacée ou redimensionnée.

[session]
# Lancement de session (décision OUI, bloc 28, 21 nov. 2026) —
# scripts/lancer_session.ps1 : minuteurs, résumés Carson (a-dire/), HUD,
# boucle vocale. Les quadrants sont dans config.local.toml (privé).
lire_a_dire = true
annoncer_minuteurs_du_jour = true
demarrer_hud = true
