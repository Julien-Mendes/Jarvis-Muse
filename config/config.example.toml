# Jarvis-Muse — configuration publique (exemple)
# Copier vers config.toml et adapter.
# Ce fichier est versionné. Ne jamais y mettre de secret ni de chemin personnel.
# Les valeurs privées vont dans config.local.toml, les secrets dans .env.

[general]
# Langue active : UNE seule clé pour tous les scripts (boucle, application,
# minuteurs, vision, voix, lanceurs). "en" par défaut à moyen terme
# (décision 21 nov. 2026) — les voix françaises Piper écoutées (Gilles, Tom)
# sonnaient trop robotiques ; le français passe par la voix UPMC quand on y
# revient. (Ancien emplacement [boucle] langue : encore respecté s'il reste
# dans votre config.toml, mais à supprimer.)
langue = "en"
# Lot L1 : langue détectée à chaque tour (Whisper, puis le texte). Jarvis
# répond, parle (Alan / UPMC) et affiche l'interface dans la langue du tour ;
# si la détection est incertaine, la langue ci-dessus sert de repli. Les
# annonces de minuteur suivent « langue », sauf pendant un tour dans l'autre
# langue. false = une seule langue, celle ci-dessus (comportement d'avant L1).
langue_auto = true
# Langues acceptées pour la clé ci-dessus ("fr" et "en" seulement).
langues_disponibles = ["fr", "en"]
# Fuseau horaire (nom IANA) : horodatages, minuteurs, rappels à heure fixe.
fuseau_horaire = "America/Toronto"

[voix]
# TTS locale : Piper (voix par défaut, voir scripts/lire_voix.py).
# Français : Piper "upmc" (féminine, UPMC/LIMSI — choisie le 21 nov. 2026 ;
# "gilles" jugée trop robotique). Télécharger avec :
#   python -m piper.download_voices fr_FR-upmc-medium --data-dir models
# Anglais (défaut à moyen terme) : Piper "alan" (masculine britannique),
# voix "en_GB-alan-medium". Kokoro reste une option ultérieure pour l'anglais.
# Seul moteur pris en charge pour l'instant : "piper".
moteur = "piper"
# Noms courts ("upmc", "alan") ou noms complets Piper ("fr_FR-upmc-medium").
voix_fr = "upmc"
voix_en = "alan"
# Vitesse de lecture : 0.5 à 2.0 (1.0 = normale).
vitesse = 1.0

[declenchement]
# Déclencheur actuel : push-to-talk F9 (validé le 21 nov. 2026, étape 4).
# Mot de réveil et double-clap : décisions "plus tard" (21 nov. 2026).
# Maintenir F9 pour parler, relâcher pour envoyer ; F9 pendant la réponse
# l'interrompt. Seule la touche F9 est prise en charge pour l'instant.
touche_push_to_talk = "F9"

[boucle]
# Boucle vocale interactive (étape 4) — scripts/boucle_voix.py.
# Cerveau par défaut : Groq gratuit (gpt-oss-120b, palier gratuit, sans carte).
# Alternative : "anthropic" (Claude Haiku par API, payant à l'usage, clé dans .env).
# Précision : Muse Code est l'outillage de construction, pas le cerveau de la
# boucle (pas une API temps réel) — la boucle fait un appel API par tour.
fournisseur_llm = "groq"
modele_groq = "openai/gpt-oss-120b"
modele_anthropic = "claude-haiku-5-5"
# Effort de raisonnement (voix = latence d'abord) : "low" recommandé.
# Groq gpt-oss : low | medium | high. Haiku 5.5 : low | medium (défaut API)
# | high | xhigh | max. "" = ne rien envoyer (défaut du fournisseur).
effort_groq = "low"
effort_anthropic = "low"
# Transcription par défaut : Groq Whisper (whisper-large-v3-turbo).
# "local" = faster-whisper hors ligne (décision bloc 5, encore ouverte).
fournisseur_stt = "groq"
modele_stt_groq = "whisper-large-v3-turbo"
modele_stt_local = "base"
# (La langue se règle dans [general] langue, pas ici.)
duree_max_enregistrement = 30.0
duree_min_enregistrement = 0.3
max_tours_outils = 3
max_tokens_reponse = 400
# Délai maximal d'UN appel au cerveau, en secondes (1 à 120). Passé ce délai,
# Jarvis abandonne l'appel et le dit. Une seule reprise automatique est
# faite avant d'abandonner : l'attente maximale est d'environ 2 fois ce délai.
delai_cerveau_s = 20
# Temps maximal d'UN tour complet (toutes les rondes d'outils), en secondes
# (5 à 300). Passé ce délai, plus aucun appel au cerveau : Jarvis dit ce qui
# est déjà fait, ou que le cerveau est trop lent (jamais de silence).
delai_tour_s = 45

[cerveau]
# Effort de raisonnement du cerveau (lot B), pour Groq comme pour Claude :
#   "bas"   rapide (défaut, comportement d'avant) — recommandé en voix ;
#   "moyen" plus lent, mieux pour les questions complexes ;
#   "auto"  bas, sauf question jugée complexe (pourquoi, compare, explique,
#           plus de 25 mots…) : moyen pour ce tour seulement.
# Prime sur [boucle] effort_groq / effort_anthropic. Mesures : docs/etape-11-cerveau.md.
effort = "bas"

[minuteur]
# Minuteur persistant local (décision OUI, 21 nov. 2026). Les minuteurs sont
# dans data/timers.json (emplacement fixe : l'application, le HUD et le
# lanceur y lisent aussi).
max_actifs = 20     # 1 à 100
duree_max = "7j"    # durée maximale d'un compte à rebours : "7j", "12h", "90m"

[yeux]
# Vision d'écran ciblée (étape 5) — scripts/yeux.py.
# Capture ciblée par défaut (fenêtre active) ; jamais tout l'écran sans
# --tout-ecran explicite ; consentement oral à chaque capture en boucle vocale.
# Fournisseur vision par défaut : "groq" (qwen/qwen3.8-27b, multimodal —
# un seul service, Groq, pour cerveau + STT + vision, décision de Julien
# le 21 nov. 2026). Llama 4 Scout a été retiré du palier gratuit Groq
# le 17 juill. 2026. qwen3.8-27b est un modèle « preview » : il peut être
# retiré à court préavis (erreur 404 = modèle indisponible).
# Repli : "anthropic" (Claude Haiku, vision confirmée, payant à l'usage,
# quelques centimes par capture au plus) — basculer = une ligne ici.
fournisseur_vision = "groq"
modele_vision_groq = "qwen/qwen3.8-27b"
modele_vision_anthropic = "claude-haiku-4-5-20251001"
largeur_max = 1280
max_tokens_description = 300

[navigateur]
# Contrôle du navigateur (étape 5) — scripts/navigateur.py (Playwright).
# Lecture seule par défaut : navigation, recherche, clics sur liens/boutons
# hors formulaire, lecture de texte, capture de page. Aucune soumission de
# formulaire, aucune connexion, aucun achat (hold_writes).
# Lot C1 — Chrome seulement : Playwright pilote Google Chrome (installé sur
# la machine), dans un profil séparé sans tes connexions.
# "playwright" (défaut depuis C1) : tout passe par Chrome piloté — un seul
# onglet réutilisé d'un tour à l'autre (pas de nouvel onglet par demande),
# recherche + clic sur une vidéo YouTube, clic sur un lien par son texte ;
# si Chrome tombe, il est relancé et Jarvis le dit. Si Chrome ne démarre
# pas, repli sur le navigateur par défaut (sans clic possible).
# "systeme" : « ouvre [site] » ouvre ton vrai navigateur par défaut (un
# nouvel onglet à chaque demande, aucun clic possible).
navigateur_defaut = "playwright"
delai_apres_navigation = 2    # secondes d'attente après une navigation (0 à 30)
max_caracteres_page = 5000    # texte de page lu au maximum (100 à 50000)

[securite]
# Ne jamais changer sans relire docs/regles-securite.md. Le blocage des
# écritures après lecture externe (hold_writes) et le serveur local sur
# 127.0.0.1 seulement sont des règles du code, pas des réglages : aucune clé
# ici ne peut les désactiver.
# Longueur maximale d'un « oui » valable : 1 à 8 mots (jamais plus de 8 ;
# le réglage ne peut que resserrer la règle).
confirmation_orale_max_mots = 8

[hud]
# HUD local léger (décision OUI, 21 nov. 2026) — scripts/hud.py (Tkinter,
# bibliothèque standard, pas de navigateur embarqué). Le HUD du dépôt B
# coûte ~760 Mo en veille : garder celui-ci minimal (< 100 Mo, ~0 % CPU).
active = true
# Position : "bas-droite" (défaut), "bas-gauche", "haut-droite", "haut-gauche".
# La position exacte est mémorisée dans data/widget.json (gitignoré).
position = "bas-droite"
taille = 180
toujours_au_premier_plan = true
# Intervalle de relecture de l'état (ms) — data/hud-state.json, écrit par
# la boucle vocale à chaque changement d'état.
intervalle_ms = 500

[app]
# Application Jarvis (étape 7, décision 21 nov. 2026) — scripts/app.py
# (CustomTkinter, thème sombre, ambiance du Jarvis de référence :
# fond très sombre, orbe lumineux qui pulse, conversation écrite).
# Remplacera le HUD quand elle sera validée ; le HUD reste disponible
# entre-temps (les deux lisent les mêmes fichiers data/).
active = true
largeur = 900   # largeur de la fenêtre en pixels (640 à 1600)
hauteur = 650   # hauteur de la fenêtre en pixels (480 à 1200)
toujours_au_premier_plan = false
# Thème des couleurs (U2) — quatre choix :
#   "or_et_nuit"   noir et or (défaut, choix de Julien)
#   "jarvis_bleu"  les couleurs d'origine, fond sombre et accent bleu
#   "clair_studio" fond clair, panneaux blancs, accent bleu
#   "centre_de_commande"  bleu nuit et cyan façon « Command Center » : orbe
#                  en globe filaire, panneaux bordés à titres en capitales,
#                  statuts colorés, jauges des minuteurs (à l'essai)
# Un nom inconnu, ou un fichier de configuration illisible : repli sur
# "jarvis_bleu". Changer le thème = modifier cette ligne (config.toml ou
# config.local.toml) puis relancer Jarvis ; pas encore de panneau Réglages.
theme = "or_et_nuit"
# Intervalle de relecture de l'état, de la conversation et des minuteurs
# (ms) — data/hud-state.json, data/conversation.jsonl, data/timers.json.
intervalle_ms = 500
# Animations (lot U5) : éclosion de l'orbe au changement d'état, orbe qui
# pulse et tourne pendant l'écoute / la réflexion / la réponse, fondu des
# nouveaux éléments des panneaux. Aucune au repos. false = tout immobile.
animations = true
# Tableau de bord (lot DB) : colonne Agents + Conversations, affichée quand
# la fenêtre fait au moins 1100 px de large (menu Affichage pour la forcer).
# Le moniteur système (CPU, RAM, disque) est toujours dans l'en-tête.
tableau_de_bord = true
# La position et la taille exactes sont mémorisées dans data/app.json
# (gitignoré) quand la fenêtre est déplacée ou redimensionnée.

[session]
# Lancement de session (décision OUI, bloc 28, 21 nov. 2026) —
# scripts/lancer_session.ps1 : minuteurs, résumés Carson (a-dire/), HUD,
# boucle vocale. Les quadrants sont dans config.local.toml (privé).
lire_a_dire = true
annoncer_minuteurs_du_jour = true
demarrer_hud = true
